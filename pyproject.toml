[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "syringe_pump"
version = "0.1.0"
description = "A Python library for controlling syringe pumps"
readme = "README.md"
authors = [
    {name = "Stefan Golas"}
]
license = {text = "MIT"}
requires-python = ">=3.6"
dependencies = [
    "requests>=2.25.0",
    "agrow-pumps>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/syringe_pump"
